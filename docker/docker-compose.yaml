x-default-isaac-lab-template-environment: &default-isaac-lab-template-environment
  - OMNI_KIT_ALLOW_ROOT=1
  - DISPLAY

x-default-isaac-lab-template-deploy: &default-isaac-lab-template-deploy
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [ gpu ]

services:
  kyon-isaac-base:
    env_file: .env.base
      #build:
      #context: ../
      #dockerfile: docker/Dockerfile
      #args:
      #  ISAACLAB_BASE_IMAGE_ARG: isaac-lab-base
      #  DOCKER_ISAACLAB_EXTENSION_TEMPLATE_PATH_ARG: .
    image: kyon-isaac-base
    container_name: kyon-isaac-base
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - type: bind
        source: ../
        target: /workspace/kyon_isaac
    network_mode: host
    environment: *default-isaac-lab-template-environment
    deploy: *default-isaac-lab-template-deploy
    # This is the entrypoint for the container
    entrypoint: bash
    stdin_open: true
    tty: true
